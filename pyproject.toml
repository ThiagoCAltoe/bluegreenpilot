[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluegreenpilot"
version = "0.1.0"
description = "Deployment safety protocol and agent skill for blue-green releases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "BlueGreenPilot contributors" }
]
keywords = [
  "blue-green",
  "deployment",
  "rollback",
  "codex",
  "openclaw",
  "agents",
  "release-engineering"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Release Engineering",
  "Topic :: System :: Systems Administration"
]
dependencies = []

[project.scripts]
bluegreenpilot = "bluegreenpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bluegreenpilot"]
